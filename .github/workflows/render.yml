# Temporary render workflow — Actions render TEST for TE-how-magnets-work.
# REMOVE FROM MAIN AFTER THE TEST (it is only dispatchable while on main).
# Fixes vs the Oct 25 test: (1) mkdir -p the temp dir before check;
# (2) SHORT TMPDIR (/tmp/hf-tmp) for check AND render — the deep workspace
# path exceeded Chrome's Unix socket length limit ("Socket path too long").
name: Render film (test)

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Project directory under projects/"
        default: "projects/te-how-magnets-work"
        type: string
      output_name:
        description: "Output MP4 filename"
        default: "te-how-magnets-work.mp4"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome deps + ffmpeg
        run: |
          # Verbose (no -qq) + bounded retries: on 2026-10-26 runs #8 and #9
          # BOTH stalled silently on this step (35+ min, 5+ min) while run #7
          # finished it in 17s. Quiet mode hid where it stuck, and a hung
          # apt would otherwise burn the whole 360-min timeout. Each attempt
          # is capped so a stall fails fast and visibly instead of hanging.
          UPDATED=0
          for i in 1 2 3; do
            echo "apt-get update attempt $i/3 ..."
            if timeout 300 sudo apt-get update; then UPDATED=1; break; fi
            echo "apt-get update attempt $i failed, retrying in 10s ..."
            sleep 10
          done
          if [ "$UPDATED" != "1" ]; then echo "STOP: apt-get update failed 3 times"; exit 1; fi
          timeout 900 sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libnss3 libnspr4 libx11-6 libxcb1 libxext6 libxi6 libxtst6 libxss1 libglib2.0-0 libdbus-1-3 libexpat1 ffmpeg
      - name: HyperFrames check (gated)
        working-directory: ${{ inputs.project_dir }}
        run: |
          mkdir -p /tmp/hf-tmp
          echo "compositions: $(ls compositions/*.html | wc -l)"
          TMPDIR=/tmp/hf-tmp npx --yes hyperframes@0.8.117 check
      - name: Render (CPU, no --browser-gpu)
        working-directory: ${{ inputs.project_dir }}
        run: |
          mkdir -p /tmp/hf-tmp renders
          set -o pipefail
          TMPDIR=/tmp/hf-tmp npx --yes hyperframes@0.8.117 render --fps 60 --workers 4 -o renders/${{ inputs.output_name }} 2>&1 | tee renders/render.log
      - name: Verify + REPORT
        working-directory: ${{ inputs.project_dir }}
        run: |
          MP4="renders/${{ inputs.output_name }}"
          test -f "$MP4" || { echo "STOP: no output MP4"; exit 1; }
          PROBE=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries stream=codec_name -show_entries format=duration,size -of default=nw=1 "$MP4")
          echo "$PROBE"
          FRAMES=$(echo "$PROBE" | grep -m1 nb_frames | head -1 | cut -d= -f2)
          DUR=$(echo "$PROBE" | grep -m1 '^duration=' | cut -d= -f2 | cut -d. -f1)
          # Expected values are computed from THIS film's own film.json
          # (duration_s, else narration dur, else sum of scene durations) —
          # NEVER hardcoded from a previous film. A hardcoded expectation
          # failed a real run (battery film, run #7: 5,888 frames / 98.13s
          # rejected against the magnets film's 3,440 / 57.34s).
          EXPECTED_DUR=$(python3 -c "
          import json
          d = json.load(open('film.json'))
          dur = d.get('duration_s')
          if not dur and d.get('audio'): dur = d['audio'][0].get('dur')
          if not dur:
              dur = sum(s[1] for s in d.get('scenes', []) if isinstance(s, (list, tuple)) and len(s) > 1)
          print(f'{float(dur):.2f}')
          ")
          EXPECTED_FRAMES=$(python3 -c "print(round(float('$EXPECTED_DUR') * 60))")
          echo "frames: $FRAMES (want $EXPECTED_FRAMES +/- 120)"
          echo "duration: ${DUR}s (want ${EXPECTED_DUR}s +/- 2s)"
          python3 - "$FRAMES" "$DUR" "$EXPECTED_FRAMES" "$EXPECTED_DUR" << 'PYEOF'
          import sys
          frames, dur, exp_frames, exp_dur = int(sys.argv[1]), float(sys.argv[2]), int(sys.argv[3]), float(sys.argv[4])
          ok = True
          if not (exp_frames - 120 <= frames <= exp_frames + 120):
              print(f"STOP CONDITION: frame count {frames} outside {exp_frames} +/- 120."); ok = False
          if not (exp_dur - 2 <= dur <= exp_dur + 2):
              print(f"STOP CONDITION: duration {dur}s outside {exp_dur}s +/- 2s."); ok = False
          sys.exit(0 if ok else 1)
          PYEOF
          echo "================ PHASE 5 ACTIONS RENDER REPORT ================"
          echo "project:      ${{ inputs.project_dir }}"
          echo "format:       1080x1920 @ 60fps, expected duration ${EXPECTED_DUR}s"
          echo "frames:       $FRAMES"
          echo "output:       $MP4"
          echo "gpu_mode:     software (CPU render expected on Actions)"
          echo "==============================================================="
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            ${{ inputs.project_dir }}/renders/${{ inputs.output_name }}
            ${{ inputs.project_dir }}/renders/*.log
