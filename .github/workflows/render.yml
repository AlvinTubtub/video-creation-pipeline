# Temporary render workflow — Actions render TEST for TE-how-magnets-work.
# REMOVE FROM MAIN AFTER THE TEST (it is only dispatchable while on main).
# Fixes vs the Oct 25 test: (1) mkdir -p the temp dir before check;
# (2) SHORT TMPDIR (/tmp/hf-tmp) for check AND render — the deep workspace
# path exceeded Chrome's Unix socket length limit ("Socket path too long").
name: Render film (test)

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Project directory under projects/"
        default: "projects/te-how-magnets-work"
        type: string
      output_name:
        description: "Output MP4 filename"
        default: "te-how-magnets-work.mp4"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome deps + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libnss3 libnspr4 libx11-6 libxcb1 libxext6 libxi6 libxtst6 libxss1 libglib2.0-0 libdbus-1-3 libexpat1 ffmpeg
      - name: HyperFrames check (gated)
        working-directory: ${{ inputs.project_dir }}
        run: |
          mkdir -p /tmp/hf-tmp
          echo "compositions: $(ls compositions/*.html | wc -l) (want 9: 6 scenes + 3 overlays)"
          TMPDIR=/tmp/hf-tmp npx --yes hyperframes@0.8.117 check
      - name: Render (CPU, no --browser-gpu)
        working-directory: ${{ inputs.project_dir }}
        run: |
          mkdir -p /tmp/hf-tmp renders
          set -o pipefail
          TMPDIR=/tmp/hf-tmp npx --yes hyperframes@0.8.117 render --fps 60 --workers 4 -o renders/${{ inputs.output_name }} 2>&1 | tee renders/render.log
      - name: Verify + REPORT
        working-directory: ${{ inputs.project_dir }}
        run: |
          MP4="renders/${{ inputs.output_name }}"
          test -f "$MP4" || { echo "STOP: no output MP4"; exit 1; }
          PROBE=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries stream=codec_name -show_entries format=duration,size -of default=nw=1 "$MP4")
          echo "$PROBE"
          FRAMES=$(echo "$PROBE" | grep -m1 nb_frames | head -1 | cut -d= -f2)
          DUR=$(echo "$PROBE" | grep -m1 '^duration=' | cut -d= -f2 | cut -d. -f1)
          echo "frames: $FRAMES (want 3440 +/- 120)"
          echo "duration: ${DUR}s (want 57.34s +/- 2s)"
          python3 - "$FRAMES" "$DUR" << 'PYEOF'
          import sys
          frames, dur = int(sys.argv[1]), float(sys.argv[2])
          ok = True
          if not (3320 <= frames <= 3560):
              print(f"STOP CONDITION: frame count {frames} outside 3440 +/- 120."); ok = False
          if not (55.34 <= dur <= 59.34):
              print(f"STOP CONDITION: duration {dur}s outside 57.34s +/- 2s."); ok = False
          sys.exit(0 if ok else 1)
          PYEOF
          echo "================ PHASE 5 ACTIONS RENDER REPORT ================"
          echo "project:      TE-how-magnets-work (TE vertical film)"
          echo "format:       1080x1920 @ 60fps, expected duration 57.34s"
          echo "frames:       $FRAMES"
          echo "output:       $MP4"
          echo "gpu_mode:     software (CPU render expected on Actions)"
          echo "==============================================================="
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            ${{ inputs.project_dir }}/renders/${{ inputs.output_name }}
            ${{ inputs.project_dir }}/renders/*.log
