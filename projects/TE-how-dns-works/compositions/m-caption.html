    <div id="cap-02" class="clip kit-caption" style="position:absolute; left:486px; width:448px; bottom:420px; text-align:left; opacity:0;">Hindi mo kailangang tandaan ang numero ng site.</div>

    <div id="cap-04" class="clip kit-caption" style="position:absolute; left:486px; width:448px; bottom:420px; text-align:left; opacity:0;">Every website lives at a number called an IP address, tulad ng address</div>

    <div id="cap-10" class="clip kit-caption" style="position:absolute; left:486px; width:448px; bottom:420px; text-align:left; opacity:0;">When you type a name, your device asks a resolver, usually run by your</div>
